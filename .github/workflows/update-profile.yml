name: Update profile README

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/README.template.md'
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_profile.py'
      - 'scripts/test_update_profile.py'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test profile generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile.py --username "$PROFILE_USERNAME"
      - name: Commit changed README
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile is already up to date"
            exit 0
          fi
          git add -- README.md
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'update profile details'
          git push
